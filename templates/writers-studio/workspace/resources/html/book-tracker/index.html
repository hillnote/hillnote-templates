<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style id="hillnote-baseline">
/* hillnote-baseline v1 */
:root{
  color-scheme:light dark;
  --background:light-dark(#f7f7f8,#131316);
  --foreground:light-dark(#1c1c1f,#ededf0);
  --card:light-dark(#ffffff,#1c1c20);
  --card-foreground:light-dark(#1c1c1f,#ededf0);
  --muted:light-dark(#efeff1,#26262b);
  --muted-foreground:light-dark(#6f6f78,#9d9da7);
  --secondary:light-dark(#ececef,#26262b);
  --secondary-foreground:light-dark(#1c1c1f,#ededf0);
  --accent:light-dark(#ececef,#2b2b31);
  --accent-foreground:light-dark(#1c1c1f,#ededf0);
  --primary:#008080;
  --primary-foreground:#ffffff;
  --destructive:light-dark(#dc2626,#ef4444);
  --destructive-foreground:#ffffff;
  --success:light-dark(#16a34a,#4ade80);
  --warning:light-dark(#d97706,#fbbf24);
  --info:light-dark(#2563eb,#60a5fa);
  --border:light-dark(#e2e2e6,#2c2c32);
  --input:light-dark(#d9d9de,#34343b);
  --ring:#008080;
  --radius:8px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 1px 2px rgb(0 0 0/.05);
  --shadow:0 4px 12px -2px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.05);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--background);color:var(--foreground);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650}
h1{font-size:19px}h2{font-size:16px}h3{font-size:14px}
h4{font-size:12px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 .75em}
a{color:var(--primary)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--muted);padding:2px 5px;border-radius:4px}
img,svg,canvas,video{max-width:100%}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px;font-weight:500;line-height:1.2;cursor:pointer;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,opacity .15s;text-decoration:none;user-select:none}
button:hover,.btn:hover{background:var(--muted)}
button:active,.btn:active{transform:translateY(.5px)}
button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.1)}
.btn-destructive{background:var(--destructive);border-color:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover{background:var(--destructive);filter:brightness(1.1)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--muted)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:6px;width:30px;height:30px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
input[type=range]{padding:0;border:none;box-shadow:none;accent-color:var(--primary)}
input[type=color]{width:36px;height:30px;padding:2px}
:is(button,.btn,input,select,textarea,a,summary):focus-visible{outline:2px solid color-mix(in srgb,var(--ring) 55%,transparent);outline-offset:1px}
label{font-size:12px;font-weight:500;color:var(--muted-foreground)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted-foreground)}
th,td{padding:7px 10px;border-bottom:1px solid var(--border)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--card-foreground);box-shadow:var(--shadow);padding:16px;max-width:min(92vw,420px)}
dialog::backdrop{background:rgb(0 0 0/.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;margin:-14px -14px 12px;padding:10px 14px;background:color-mix(in srgb,var(--background) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:calc(var(--radius) - 2px);border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--muted);color:var(--muted-foreground)}
.badge-success{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.badge-warning{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.badge-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.badge-danger{background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive)}
.muted{color:var(--muted-foreground)}
.empty-state{padding:32px 12px;text-align:center;color:var(--muted-foreground);font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground);border:2px solid transparent;background-clip:padding-box}
</style>
<script id="hillnote-error-bridge">(function(){var seen={};function send(m,s,l){try{m=String(m).slice(0,500);var k=m+'|'+(l||0);if(seen[k])return;seen[k]=1;window.parent.postMessage({type:'hillnote-tool-error',message:m,source:s?String(s).slice(0,200):'',line:l||0},'*')}catch(e){}}
window.addEventListener('error',function(e){send(e.message||'Script error',e.filename,e.lineno)});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;send((r&&r.message)||String(r||'Unhandled promise rejection'),'',0)});
var ce=console.error;console.error=function(){try{send(Array.prototype.map.call(arguments,function(a){return a instanceof Error?(a.message||String(a)):(typeof a==='object'?JSON.stringify(a):String(a))}).join(' '),'',0)}catch(e){}return ce.apply(console,arguments)};})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book tracker</title>
<style>
  [hidden] { display: none !important; }
  section + section { margin-top: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .big small { font-size: 14px; font-weight: 500; color: var(--muted-foreground); letter-spacing: 0; }
  .length { width: 150px; }
  .length input { text-align: right; font-variant-numeric: tabular-nums; }
  .hint { font-size: 11px; color: var(--muted-foreground); }
  .bar { display: flex; height: 12px; margin: 14px 0 8px; border-radius: 999px; background: var(--muted); overflow: hidden; }
  .bar span { display: block; height: 100%; min-width: 2px; transition: width .3s; }
  .bar span + span { box-shadow: -1px 0 0 var(--card); }
  .summary { margin: 0; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted-foreground); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .count { padding: 10px 12px; border-radius: calc(var(--radius) - 2px); background: var(--muted); }
  .count-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-foreground); }
  .count-value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }

  .pace-line { margin: 0 0 6px; font-size: 13px; }
  .pace-line strong { font-variant-numeric: tabular-nums; }
  .pace-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; align-items: end; }
  .pace-head { justify-content: space-between; margin-bottom: 8px; }
  .pace-head h4 { margin: 0; }

  .parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .part-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .part-head h3 { margin: 0; display: flex; align-items: center; gap: 8px; }
  .part-head h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .part-head .muted { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chapter { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 8px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
  .chapter:last-child { border-bottom: none; }
  .chapter .emoji { font-size: 15px; line-height: 20px; text-align: center; }
  .chapter .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chapter .name { font-weight: 550; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 4px; font-size: 11px; line-height: 16px; white-space: nowrap; flex-shrink: 0; background: var(--muted); color: var(--muted-foreground); }
  .slim { grid-column: 2; height: 5px; border-radius: 999px; background: var(--muted); overflow: hidden; }
  .slim span { display: block; height: 100%; border-radius: inherit; transition: width .3s; }
  .meta { grid-column: 2; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; color: var(--muted-foreground); margin: 0; }
  .note.err { color: var(--destructive); }
  .pace-foot { justify-content: space-between; flex-wrap: wrap; margin-top: 8px; }
  .empty-state p { margin: 0 0 10px; }
</style>
</head>
<body>
<div class="toolbar">
  <strong>Book</strong>
  <span class="badge" id="badge">Loading</span>
</div>

<div id="empty" class="empty-state" hidden>
  <p id="emptyText"></p>
  <button class="btn-sm" id="retry" hidden>Try again</button>
</div>

<div id="main" hidden>
  <section class="card" aria-label="Manuscript">
    <div class="hero">
      <div>
        <h4>Manuscript</h4>
        <div class="big" id="total">0 <small>words</small></div>
      </div>
      <div class="field length">
        <label for="length">Book length</label>
        <input id="length" type="number" min="1000" step="1000" inputmode="numeric">
      </div>
    </div>
    <div class="bar" id="bar" role="img"></div>
    <p class="summary" id="summary"></p>
    <div class="legend" id="legend"></div>
    <p class="hint" style="margin-top: 8px">Keep the book length in step with $book_target in variables.md.</p>
  </section>

  <section class="counts" aria-label="Chapters" id="counts"></section>

  <section class="card" aria-label="Pace">
    <div class="row pace-head"><h4>Pace</h4><span class="badge" id="paceBadge" hidden></span></div>
    <p class="pace-line" id="paceLine"></p>
    <p class="pace-line" id="dueLine" hidden></p>
    <div class="pace-grid">
      <div class="field" id="manualField" hidden>
        <label for="manual">Words a week, roughly</label>
        <input id="manual" type="number" min="0" step="100" inputmode="numeric">
      </div>
      <div class="field">
        <label for="due">Draft due (optional)</label>
        <input id="due" type="date">
      </div>
    </div>
    <div class="row pace-foot">
      <p class="note" id="paceNote"></p>
      <button class="btn-sm btn-ghost" id="connect" hidden>Connect the Writing log</button>
    </div>
  </section>

  <section class="parts" id="parts" aria-label="Chapters by part"></section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var memory = {};
  var store = {
    get: function (k, d) { try { return window.hillnote ? hillnote.settings.get(k, d) : (k in memory ? memory[k] : d); } catch (e) { return d; } },
    set: function (k, v) { try { if (window.hillnote) hillnote.settings.set(k, v); else memory[k] = v; } catch (e) { /* settings full or unavailable */ } }
  };
  var DEFAULT_LENGTH = 60000;
  var PACE_DAYS = 28;
  var DEFAULT_PARTS = ['Opening', 'Hands', 'Places', 'People'];
  var FALLBACK_COLORS = ['var(--primary)', 'var(--info)', 'var(--success)', 'var(--warning)', 'var(--destructive)'];
  var NO_PART = 'No part yet';
  var DRAFTED = { editing: 1, ready: 1, published: 1 };
  var NOT_STARTED = { idea: 1 };

  var pieces = null;      // the Pieces source
  var log = null;         // the Writing log sheet, or null when it can't be opened
  var logError = '';
  var pieceCols = [];
  var logCols = [];
  var rows = [];
  var logRows = [];
  var cols = {};
  var lcols = {};
  var renderTimer = null;
  var fatal = "";
  var logSubscribed = false;
  var piecesSubscribed = false;

  var num = function (v) { var n = Number(v); return Number.isFinite(n) ? n : 0; };
  var fmt = function (n) { return Math.round(n).toLocaleString(); };
  var lower = function (v) { return String(v == null ? '' : v).trim().toLowerCase(); };

  function parseDay(v) {
    if (!v) return null;
    var s = String(v);
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    var d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function addDays(d, k) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + k); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function longDate(d) { return d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }); }
  function roundPace(n) { return n >= 1000 ? Math.round(n / 50) * 50 : n >= 100 ? Math.round(n / 10) * 10 : Math.round(n); }

  // ------------------------------------------------------------ columns
  function findCol(list, id, test) {
    var byId = list.find(function (c) { return c && c.id === id; });
    if (byId) return byId;
    return list.find(function (c) { return c && test(c); }) || null;
  }
  function detectPieceCols() {
    var list = pieceCols;
    var isNum = function (c) { return c.type === 'number' || c.type === 'formula'; };
    cols = {
      type: findCol(list, 'type', function (c) { return /^type$/i.test(c.name || '') || (Array.isArray(c.options) && c.options.indexOf('Book chapter') !== -1); }),
      part: findCol(list, 'part', function (c) { return /part/i.test(c.name || '') && (c.type === 'select' || c.type === 'status'); }),
      status: findCol(list, 'status', function (c) { return c.type === 'status'; }),
      current: findCol(list, 'current_words', function (c) { return isNum(c) && /current|written|so far/i.test(c.name || ''); }),
      target: findCol(list, 'target_words', function (c) { return isNum(c) && /target|goal/i.test(c.name || ''); }),
      perDay: findCol(list, 'per_day', function (c) { return /a day|per day/i.test(c.name || ''); }),
      date: findCol(list, 'publish_date', function (c) { return c.type === 'date' && /publish|due|date/i.test(c.name || ''); })
    };
  }
  function detectLogCols() {
    lcols = {
      date: findCol(logCols, 'date', function (c) { return c.type === 'date'; }),
      words: findCol(logCols, 'words', function (c) { return c.type === 'number' && /words/i.test(c.name || ''); })
    };
  }
  function val(row, col) { return col ? row[col.id] : undefined; }

  // A colour for a part: the option's own colour from the database, unless
  // it is too pale to show on the bar track (gray), then a theme token.
  function hexLuminance(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return null;
    var n = parseInt(m[1], 16);
    return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  }
  function partColor(part, index) {
    var st = cols.part && cols.part.optionStyles && cols.part.optionStyles[part];
    if (st && st.bg) {
      var l = hexLuminance(st.bg);
      if (l !== null && l < 0.82) return st.bg;
      return 'var(--muted-foreground)';
    }
    return part === NO_PART ? 'var(--muted-foreground)' : FALLBACK_COLORS[index % FALLBACK_COLORS.length];
  }
  function statusChip(status) {
    if (!status) return '';
    var st = cols.status && cols.status.optionStyles && cols.status.optionStyles[status];
    var style = st && st.bg ? ' style="background:' + esc(st.bg) + ';color:' + esc(st.fg || 'inherit') + '"' : '';
    return '<span class="chip"' + style + '>' + esc(status) + '</span>';
  }

  // ------------------------------------------------------------ model
  function chapters() {
    return rows.filter(function (r) {
      if (!cols.type) return true;
      return lower(val(r, cols.type)) === 'book chapter';
    });
  }
  function stage(r) {
    var s = lower(val(r, cols.status));
    var states = (cols.status && cols.status.optionStates) || {};
    if (DRAFTED[s] || states[val(r, cols.status)] === 'done') return 'drafted';
    if (NOT_STARTED[s] || (!s && !num(val(r, cols.current)))) return 'none';
    return 'progress';
  }
  function partOrder(list) {
    var opts = cols.part && Array.isArray(cols.part.options) && cols.part.options.length ? cols.part.options.slice() : DEFAULT_PARTS.slice();
    list.forEach(function (r) {
      var p = val(r, cols.part);
      if (p && opts.indexOf(p) === -1) opts.push(String(p));
    });
    return opts;
  }

  function pace(chapterTitles) {
    var out = { connected: !!log, perWeek: 0, logged: 0, windowDays: PACE_DAYS };
    if (!log) {
      out.perWeek = Math.max(0, num(store.get('manualPace', 0)));
      return out;
    }
    var now = today();
    var titles = {};
    chapterTitles.forEach(function (t) { titles[lower(t)] = true; });
    var earliest = null;
    logRows.forEach(function (r) {
      var d = parseDay(val(r, lcols.date));
      if (d && (!earliest || d < earliest)) earliest = d;
    });
    var span = earliest ? Math.min(PACE_DAYS, Math.max(7, daysBetween(earliest, now) + 1)) : PACE_DAYS;
    var from = addDays(now, -(span - 1));
    logRows.forEach(function (r) {
      var d = parseDay(val(r, lcols.date));
      if (!d || d < from || d > now) return;
      if (!titles[lower(r.title)]) return;
      out.logged += num(val(r, lcols.words));
    });
    out.windowDays = span;
    out.perWeek = out.logged / span * 7;
    return out;
  }

  // ------------------------------------------------------------ render
  function showEmpty(text, canRetry) {
    $('main').hidden = true;
    $('empty').hidden = false;
    $('emptyText').textContent = text;
    $('retry').hidden = !canRetry;
  }

  function render() {
    if (fatal) {
      $('badge').textContent = 'Not connected';
      $('badge').className = 'badge';
      showEmpty(fatal, true);
      return;
    }
    var list = chapters();
    if (!list.length) {
      $('badge').textContent = 'No chapters yet';
      $('badge').className = 'badge';
      showEmpty('Book chapters from Pieces show up here. Set a piece\'s Type to Book chapter.');
      return;
    }
    $('empty').hidden = true;
    $('main').hidden = false;

    var length = Math.max(1, num(store.get('bookLength', DEFAULT_LENGTH)) || DEFAULT_LENGTH);
    if (document.activeElement !== $('length')) $('length').value = length;
    var total = list.reduce(function (n, r) { return n + num(val(r, cols.current)); }, 0);
    var toGo = Math.max(0, length - total);
    var pct = Math.min(100, total / length * 100);

    $('badge').textContent = Math.floor(pct) + '% drafted';
    $('badge').className = 'badge' + (pct >= 100 ? ' badge-success' : '');
    $('total').innerHTML = fmt(total) + ' <small>of ' + fmt(length) + ' words</small>';

    // Group by part
    var order = partOrder(list);
    var groups = {};
    list.forEach(function (r) {
      var p = val(r, cols.part);
      var key = p ? String(p) : NO_PART;
      (groups[key] = groups[key] || []).push(r);
    });
    var keys = order.filter(function (p) { return groups[p]; });
    if (groups[NO_PART]) keys.push(NO_PART);
    var colorOf = {};
    keys.forEach(function (k) { colorOf[k] = partColor(k, order.indexOf(k) === -1 ? keys.indexOf(k) : order.indexOf(k)); });

    var scale = Math.max(length, total);
    $('bar').innerHTML = keys.map(function (k) {
      var w = groups[k].reduce(function (n, r) { return n + num(val(r, cols.current)); }, 0);
      if (!w) return '';
      return '<span style="width:' + (w / scale * 100).toFixed(2) + '%;background:' + esc(colorOf[k]) + '" title="' + esc(k + ': ' + fmt(w) + ' words') + '"></span>';
    }).join('');
    $('bar').setAttribute('aria-label', fmt(total) + ' of ' + fmt(length) + ' words written');
    $('summary').innerHTML = toGo
      ? '<strong>' + Math.floor(pct) + '%</strong> of the way. <strong>' + fmt(toGo) + '</strong> words to go.'
      : 'The first draft has reached full length. Time for the editing passes.';
    $('legend').innerHTML = keys.map(function (k) {
      var w = groups[k].reduce(function (n, r) { return n + num(val(r, cols.current)); }, 0);
      return '<span><i style="background:' + esc(colorOf[k]) + '"></i>' + esc(k) + ' <span class="num">' + fmt(w) + '</span></span>';
    }).join('');

    // Counts
    var counts = { drafted: 0, progress: 0, none: 0 };
    list.forEach(function (r) { counts[stage(r)]++; });
    $('counts').innerHTML = [['Drafted', counts.drafted], ['In progress', counts.progress], ['Not started', counts.none]].map(function (c) {
      return '<div class="count"><div class="count-label">' + c[0] + '</div><div class="count-value">' + c[1] + '</div></div>';
    }).join('');

    renderPace(list, toGo);

    // Chapters by part
    $('parts').innerHTML = keys.map(function (k) {
      var items = groups[k].slice().sort(function (a, b) {
        var da = parseDay(val(a, cols.date)), db = parseDay(val(b, cols.date));
        if (da && db && da - db) return da - db;
        if (da && !db) return -1;
        if (db && !da) return 1;
        return String(a.title).localeCompare(String(b.title));
      });
      var w = items.reduce(function (n, r) { return n + num(val(r, cols.current)); }, 0);
      var t = items.reduce(function (n, r) { return n + num(val(r, cols.target)); }, 0);
      return '<div class="card"><div class="part-head"><h3><i style="background:' + esc(colorOf[k]) + '"></i>' + esc(k) + '</h3>' +
        '<span class="muted">' + items.length + (items.length === 1 ? ' chapter' : ' chapters') + ' · ' + fmt(w) + (t ? ' of ' + fmt(t) : '') + ' words</span></div>' +
        items.map(function (r) { return chapterHtml(r, colorOf[k]); }).join('') + '</div>';
    }).join('');
  }

  function chapterHtml(r, color) {
    var cur = num(val(r, cols.current));
    var tgt = num(val(r, cols.target));
    var width = tgt ? Math.min(100, cur / tgt * 100) : (cur ? 100 : 0);
    var perDay = val(r, cols.perDay);
    var perDayText = typeof perDay === 'number' && perDay > 0 ? fmt(perDay) + ' a day to deadline' : '';
    var emoji = r._emoji ? esc(r._emoji) : '';
    return '<div class="chapter">' +
      '<div class="emoji" aria-hidden="true">' + emoji + '</div>' +
      '<div class="head"><span class="name" title="' + esc(r.title) + '">' + esc(r.title) + '</span>' + statusChip(val(r, cols.status)) + '</div>' +
      '<div class="slim"><span style="width:' + width.toFixed(1) + '%;background:' + esc(color) + '"></span></div>' +
      '<div class="meta"><span>' + fmt(cur) + (tgt ? ' of ' + fmt(tgt) : '') + ' words</span><span>' + perDayText + '</span></div>' +
      '</div>';
  }

  function renderPace(list, toGo) {
    var p = pace(list.map(function (r) { return r.title; }));
    $('manualField').hidden = p.connected;
    if (!p.connected && document.activeElement !== $('manual')) $('manual').value = num(store.get('manualPace', 0)) || '';
    var due = parseDay(store.get('due', ''));
    if (document.activeElement !== $('due')) $('due').value = store.get('due', '') || '';
    var now = today();
    var perWeek = p.perWeek;
    var shown = roundPace(perWeek);

    if (!toGo) {
      $('paceLine').textContent = 'Nothing left to draft. The pace takes a rest.';
    } else if (perWeek > 0) {
      var finish = addDays(now, Math.ceil(toGo / perWeek * 7));
      var source = p.connected ? 'over the last ' + (p.windowDays === PACE_DAYS ? 'four weeks' : p.windowDays + ' days') : 'by your own estimate';
      $('paceLine').innerHTML = 'At about <strong>' + fmt(shown) + ' words a week</strong> ' + esc(source) + ', the first draft lands around <strong>' + esc(longDate(finish)) + '</strong>.';
    } else if (p.connected) {
      $('paceLine').textContent = 'No book words in the Writing log over the last four weeks. Log a sprint against a chapter and a finish date appears here.';
    } else {
      $('paceLine').textContent = 'Set a rough weekly pace below to see when the first draft lands.';
    }

    var badge = $('paceBadge');
    badge.hidden = true;
    $('dueLine').hidden = true;
    if (due && toGo) {
      var daysLeft = daysBetween(now, due);
      $('dueLine').hidden = false;
      if (daysLeft <= 0) {
        $('dueLine').innerHTML = 'The draft was due on <strong>' + esc(longDate(due)) + '</strong>, with ' + fmt(toGo) + ' words still to write.';
        badge.textContent = 'Past due';
        badge.className = 'badge badge-danger';
        badge.hidden = false;
      } else {
        var needed = toGo / (daysLeft / 7);
        $('dueLine').innerHTML = 'To finish by <strong>' + esc(longDate(due)) + '</strong>: about <strong>' + fmt(roundPace(needed)) + ' words a week</strong>' +
          (daysLeft < 7 ? ' (' + daysLeft + (daysLeft === 1 ? ' day' : ' days') + ' left)' : '') + '.';
        if (perWeek > 0) {
          var ok = perWeek >= needed;
          badge.textContent = ok ? 'On track' : 'Behind';
          badge.className = 'badge ' + (ok ? 'badge-success' : 'badge-warning');
          badge.hidden = false;
        }
      }
    }

    $('paceNote').className = 'note';
    $('connect').hidden = p.connected;
    if (p.connected) {
      $('paceNote').textContent = 'Counts sprints in the Writing log whose piece is a book chapter.';
    } else {
      $('paceNote').textContent = 'The Writing log isn\'t connected' + (logError ? ' (' + logError + ')' : '') + ', so the pace comes from the number above.';
    }
  }

  function schedule() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 60);
  }

  // ------------------------------------------------------------ data
  async function loadPieces() {
    try {
      rows = await pieces.rows({ ignoreView: true });
    } catch (err) {
      rows = [];
      fatal = 'Could not read the Pieces database: ' + (err && err.message ? err.message : err);
      schedule();
      return false;
    }
    fatal = '';
    schedule();
    return true;
  }
  async function loadLog() {
    if (!log) return;
    try {
      logRows = await log.rows();
    } catch (err) {
      logRows = [];
      log = null;
      logError = err && err.message ? err.message : String(err);
    }
    schedule();
  }

  // ------------------------------------------------------------ events
  $('length').addEventListener('change', function () {
    var n = Math.round(num($('length').value));
    store.set('bookLength', n >= 1000 ? n : DEFAULT_LENGTH);
    render();
  });
  $('manual').addEventListener('input', function () {
    store.set('manualPace', Math.max(0, Math.round(num($('manual').value))));
    schedule();
  });
  $('due').addEventListener('change', function () {
    store.set('due', /^\d{4}-\d{2}-\d{2}$/.test($('due').value) ? $('due').value : '');
    render();
  });

  async function connectPieces() {
    try {
      pieces = await hillnote.data();
    } catch (err) {
      pieces = null;
      fatal = 'Could not open the Pieces database: ' + (err && err.message ? err.message : err);
      render();
      return false;
    }
    pieceCols = typeof pieces.columns === 'function' ? (pieces.columns() || []) : [];
    detectPieceCols();
    if (!piecesSubscribed && typeof pieces.onChange === 'function') { pieces.onChange(loadPieces); piecesSubscribed = true; }
    return loadPieces();
  }

  async function connectLog() {
    if (typeof hillnote.sheet !== 'function') return;
    try {
      log = await hillnote.sheet('Writing log');
      logError = '';
    } catch (err) {
      log = null;
      logError = err && err.message ? err.message : String(err);
      schedule();
      return;
    }
    logCols = typeof log.columns === 'function' ? (log.columns() || []) : [];
    detectLogCols();
    if (!logSubscribed && typeof log.onChange === 'function') { log.onChange(loadLog); logSubscribed = true; }
    await loadLog();
  }

  $('retry').addEventListener('click', async function () {
    $('retry').disabled = true;
    fatal = '';
    if (pieces) await loadPieces(); else await connectPieces();
    $('retry').disabled = false;
    render();
  });
  $('connect').addEventListener('click', async function () {
    $('connect').disabled = true;
    await connectLog();
    $('connect').disabled = false;
    render();
  });

  async function start() {
    if (!window.hillnote || typeof hillnote.data !== 'function') {
      $('badge').textContent = 'Not connected';
      showEmpty('Open this in Hillnote, as the Book view of Pieces or inside the Book plan, to see the manuscript.', false);
      return;
    }
    try { await hillnote.ready(); } catch (e) { /* render anyway */ }
    await Promise.all([connectPieces(), connectLog()]);
    render();
  }

  start();
})();
</script>
</body>
</html>
