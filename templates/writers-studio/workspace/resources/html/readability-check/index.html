<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="hillnote-baseline">
/* hillnote-baseline v1 */
:root{
  color-scheme:light dark;
  --background:light-dark(#f7f7f8,#131316);
  --foreground:light-dark(#1c1c1f,#ededf0);
  --card:light-dark(#ffffff,#1c1c20);
  --card-foreground:light-dark(#1c1c1f,#ededf0);
  --muted:light-dark(#efeff1,#26262b);
  --muted-foreground:light-dark(#6f6f78,#9d9da7);
  --secondary:light-dark(#ececef,#26262b);
  --secondary-foreground:light-dark(#1c1c1f,#ededf0);
  --accent:light-dark(#ececef,#2b2b31);
  --accent-foreground:light-dark(#1c1c1f,#ededf0);
  --primary:#D52C78;
  --primary-foreground:#ffffff;
  --destructive:light-dark(#dc2626,#ef4444);
  --destructive-foreground:#ffffff;
  --success:light-dark(#16a34a,#4ade80);
  --warning:light-dark(#d97706,#fbbf24);
  --info:light-dark(#2563eb,#60a5fa);
  --border:light-dark(#e2e2e6,#2c2c32);
  --input:light-dark(#d9d9de,#34343b);
  --ring:#D52C78;
  --radius:8px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 1px 2px rgb(0 0 0/.05);
  --shadow:0 4px 12px -2px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.05);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--background);color:var(--foreground);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650}
h1{font-size:19px}h2{font-size:16px}h3{font-size:14px}
h4{font-size:12px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 .75em}
a{color:var(--primary)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--muted);padding:2px 5px;border-radius:4px}
img,svg,canvas,video{max-width:100%}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px;font-weight:500;line-height:1.2;cursor:pointer;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,opacity .15s;text-decoration:none;user-select:none}
button:hover,.btn:hover{background:var(--muted)}
button:active,.btn:active{transform:translateY(.5px)}
button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.1)}
.btn-destructive{background:var(--destructive);border-color:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover{background:var(--destructive);filter:brightness(1.1)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--muted)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:6px;width:30px;height:30px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
input[type=range]{padding:0;border:none;box-shadow:none;accent-color:var(--primary)}
input[type=color]{width:36px;height:30px;padding:2px}
:is(button,.btn,input,select,textarea,a,summary):focus-visible{outline:2px solid color-mix(in srgb,var(--ring) 55%,transparent);outline-offset:1px}
label{font-size:12px;font-weight:500;color:var(--muted-foreground)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted-foreground)}
th,td{padding:7px 10px;border-bottom:1px solid var(--border)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--card-foreground);box-shadow:var(--shadow);padding:16px;max-width:min(92vw,420px)}
dialog::backdrop{background:rgb(0 0 0/.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;margin:-14px -14px 12px;padding:10px 14px;background:color-mix(in srgb,var(--background) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:calc(var(--radius) - 2px);border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--muted);color:var(--muted-foreground)}
.badge-success{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.badge-warning{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.badge-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.badge-danger{background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive)}
.muted{color:var(--muted-foreground)}
.empty-state{padding:32px 12px;text-align:center;color:var(--muted-foreground);font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground);border:2px solid transparent;background-clip:padding-box}
</style>
<script id="hillnote-error-bridge">(function(){var seen={};function send(m,s,l){try{m=String(m).slice(0,500);var k=m+'|'+(l||0);if(seen[k])return;seen[k]=1;window.parent.postMessage({type:'hillnote-tool-error',message:m,source:s?String(s).slice(0,200):'',line:l||0},'*')}catch(e){}}
window.addEventListener('error',function(e){send(e.message||'Script error',e.filename,e.lineno)});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;send((r&&r.message)||String(r||'Unhandled promise rejection'),'',0)});
var ce=console.error;console.error=function(){try{send(Array.prototype.map.call(arguments,function(a){return a instanceof Error?(a.message||String(a)):(typeof a==='object'?JSON.stringify(a):String(a))}).join(' '),'',0)}catch(e){}return ce.apply(console,arguments)};})()</script>
<title>Readability check</title>
<style>
  textarea { min-height: 150px; font-size: 14px; line-height: 1.55; }
  .controls { justify-content: space-between; margin-top: 8px; flex-wrap: wrap; }
  .controls .field { flex-direction: row; align-items: center; gap: 6px; }
  .controls input { width: 64px; }
  .score { display: flex; align-items: center; gap: 14px; }
  .gauge { width: 76px; height: 76px; flex: none; }
  .gauge .track { fill: none; stroke: var(--muted); stroke-width: 9; }
  .gauge .fill { fill: none; stroke-width: 9; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .gauge text { font-size: 20px; font-weight: 650; fill: var(--foreground); }
  .band { font-size: 15px; font-weight: 650; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 12px; }
  .metric { background: var(--muted); border-radius: calc(var(--radius) - 2px); padding: 8px 10px; }
  .metric small { display: block; font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .04em; }
  .metric strong { font-size: 17px; font-variant-numeric: tabular-nums; }
  .flags .list-item { justify-content: space-between; }
  .flags .list-item span:first-child { min-width: 0; }
  .flags small { display: block; color: var(--muted-foreground); font-size: 12px; }
  .preview { font-size: 14px; line-height: 1.7; max-height: 420px; overflow: auto; }
  .preview p { margin: 0 0 .9em; }
  .long { background: color-mix(in srgb, var(--warning) 18%, transparent); border-radius: 3px; }
  .very-long { background: color-mix(in srgb, var(--destructive) 15%, transparent); border-radius: 3px; }
  .adv { text-decoration: underline wavy color-mix(in srgb, var(--info) 80%, transparent); text-underline-offset: 3px; }
  .passive { text-decoration: underline color-mix(in srgb, var(--destructive) 75%, transparent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .filler { text-decoration: underline dotted var(--muted-foreground); text-underline-offset: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted-foreground); margin-bottom: 10px; }
  section + section { margin-top: 14px; }
</style>
</head>
<body>
<div class="toolbar">
  <strong>Readability check</strong>
  <span class="badge" id="badge">No text yet</span>
</div>

<section class="card">
  <label for="text">Your writing</label>
  <textarea id="text" placeholder="Paste a paragraph or a whole draft. Nothing leaves this page."></textarea>
  <div class="row controls">
    <div class="field"><label for="limit">Flag sentences over</label><input id="limit" type="number" min="10" max="60" step="1"><span class="muted">words</span></div>
    <button class="btn-ghost btn-sm" id="clear">Clear</button>
  </div>
</section>

<div id="empty" class="empty-state">Paste some writing above to see its reading ease, sentence length, long sentences, adverbs and likely passive voice.</div>

<div id="results" hidden>
  <section class="card">
    <div class="score">
      <svg class="gauge" viewBox="0 0 80 80" aria-hidden="true"><circle class="track" cx="40" cy="40" r="33"></circle><circle class="fill" id="gaugeFill" cx="40" cy="40" r="33"></circle><text x="40" y="47" text-anchor="middle" id="gaugeText">0</text></svg>
      <div>
        <div class="band" id="band"></div>
        <div class="muted" id="bandNote"></div>
      </div>
    </div>
    <div class="grid" id="metrics"></div>
  </section>

  <section class="card flags">
    <h4>What to look at</h4>
    <div class="list" id="flags"></div>
  </section>

  <section class="card">
    <h4>Marked up</h4>
    <div class="legend">
      <span><span class="long">Long sentence</span></span>
      <span><span class="very-long">Very long</span></span>
      <span><span class="adv">Adverb</span></span>
      <span><span class="passive">Maybe passive</span></span>
      <span><span class="filler">Filler</span></span>
    </div>
    <div class="preview" id="preview"></div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var memory = {};
  var store = {
    get: function (k, d) { try { return window.hillnote ? hillnote.settings.get(k, d) : (k in memory ? memory[k] : d); } catch (e) { return d; } },
    set: function (k, v) { try { if (window.hillnote) hillnote.settings.set(k, v); else memory[k] = v; } catch (e) { /* ignore */ } }
  };
  var MAX_DRAFT = 20000;
  var CIRC = 2 * Math.PI * 33;

  var NOT_ADVERBS = new Set(('only family early reply apply supply holy ugly belly bully jelly fly july italy rely ally lily silly friendly lovely lonely ' +
    'daily weekly monthly yearly hourly nightly costly elderly curly chilly hilly oily woolly holly rally tally assembly anomaly butterfly dragonfly ' +
    'multiply comply imply deadly lively orderly timely homely kindly likely unlikely smelly jolly folly sly ply wily burly surly bubbly cuddly ' +
    'wrinkly prickly sickly sprightly ghastly ghostly heavenly worldly manly womanly scholarly beastly portly stately leisurely courtly fly-by').split(' '));
  var PARTICIPLES = ('built made done given taken seen written known shown found held kept left lost paid sold told brought bought caught taught thought ' +
    'broken chosen driven eaten fallen forgotten frozen hidden ridden risen shaken spoken stolen sworn torn worn woven begun drunk sung sunk put set cut ' +
    'hit hurt read run sent spent lent meant felt dealt led fed met sewn shown thrown grown drawn understood forgiven mistaken overlooked born worn bent ' +
    'bound dug fought ground hung lit shot shut slit spun stuck stung struck swept swung wound won').split(' ');
  var PASSIVE = new RegExp('\\b(am|is|are|was|were|be|been|being|get|gets|got|gotten|getting)\\s+(?:\\w+ly\\s+)?(\\w+ed|' + PARTICIPLES.join('|') + ')\\b', 'gi');
  var FILLER = /\b(very|really|just|quite|rather|somewhat|actually|basically|simply|literally|totally|in order to|kind of|sort of|a bit)\b/gi;
  var WORD = /[A-Za-zÀ-ɏ]+(?:['’][A-Za-z]+)*|\d+(?:[.,]\d+)*/g;

  function cleanMarkdown(text) {
    return text
      .replace(/\[\[([^\]|]+)\|[^\]]*\]\]/g, '$1')
      .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/^\s{0,3}(#{1,6}|>|[-*+]|\d+\.)\s+/gm, '')
      .replace(/[*_`~]{1,3}/g, '')
      .replace(/:::[^\n]*\n?/g, '');
  }

  function syllables(word) {
    var w = word.toLowerCase().replace(/[^a-z]/g, '');
    if (!w) return /\d/.test(word) ? 1 : 0;
    if (w.length <= 3) return 1;
    w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '');
    var groups = w.match(/[aeiouy]{1,2}/g);
    return Math.max(1, groups ? groups.length : 1);
  }

  function splitSentences(paragraph) {
    var protectedText = paragraph.replace(/\b(Mr|Mrs|Ms|Dr|St|Prof|vs|etc|e\.g|i\.e|No)\./g, '$1․');
    var parts = protectedText.match(/[^.!?…]+(?:[.!?…]+["'”’)\]]*|$)/g) || [];
    return parts.map(function (s) { return s.replace(/․/g, '.'); }).filter(function (s) { return /[A-Za-z0-9]/.test(s); });
  }

  function isAdverb(w) {
    var lw = w.toLowerCase();
    return lw.length > 4 && /ly$/.test(lw) && !NOT_ADVERBS.has(lw);
  }

  function analyse(raw, limit) {
    var paragraphs = cleanMarkdown(raw).split(/\n\s*\n/).map(function (p) { return p.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    var out = { paragraphs: [], words: 0, sentences: 0, syllables: 0, long: 0, veryLong: 0, adverbs: 0, passive: 0, filler: 0, longest: 0 };
    paragraphs.forEach(function (p) {
      var sentences = splitSentences(p).map(function (s) {
        var ws = s.match(WORD) || [];
        var syl = ws.reduce(function (n, w) { return n + syllables(w); }, 0);
        var adv = ws.filter(isAdverb).length;
        var pas = (s.match(PASSIVE) || []).length;
        var fil = (s.match(FILLER) || []).length;
        out.words += ws.length; out.syllables += syl; out.adverbs += adv; out.passive += pas; out.filler += fil;
        out.longest = Math.max(out.longest, ws.length);
        var level = ws.length > limit * 1.6 ? 'very-long' : (ws.length > limit ? 'long' : '');
        if (level === 'long') out.long++;
        if (level === 'very-long') out.veryLong++;
        return { text: s.trim(), words: ws.length, level: level };
      });
      out.sentences += sentences.length;
      out.paragraphs.push(sentences);
    });
    var wps = out.sentences ? out.words / out.sentences : 0;
    var spw = out.words ? out.syllables / out.words : 0;
    out.avgSentence = wps;
    out.ease = out.words ? Math.max(0, Math.min(100, 206.835 - 1.015 * wps - 84.6 * spw)) : 0;
    out.grade = out.words ? Math.max(0, 0.39 * wps + 11.8 * spw - 15.59) : 0;
    out.minutes = out.words / 238;
    return out;
  }

  function band(score) {
    if (score >= 90) return ['Very easy', 'Short words, short sentences. Good for a quick note.', 'success'];
    if (score >= 80) return ['Easy', 'Conversational. Most readers glide through it.', 'success'];
    if (score >= 70) return ['Fairly easy', 'Comfortable for a newsletter.', 'success'];
    if (score >= 60) return ['Plain English', 'The sweet spot for most essays.', 'success'];
    if (score >= 50) return ['Fairly difficult', 'Fine for a book chapter; check the longest sentences.', 'warning'];
    if (score >= 30) return ['Difficult', 'Readers will need to slow down. Is that what you want?', 'warning'];
    return ['Very difficult', 'Academic density. Break up sentences and swap long words.', 'danger'];
  }

  function markSentence(s) {
    var html = esc(s.text);
    html = html.replace(PASSIVE, function (m) { return '<span class="passive">' + m + '</span>'; });
    html = html.replace(FILLER, function (m) { return '<span class="filler">' + m + '</span>'; });
    html = html.replace(/<[^>]+>|[A-Za-zÀ-ɏ]+(?:['’][A-Za-z]+)*/g, function (m) {
      if (m.charAt(0) === '<') return m;
      return isAdverb(m) ? '<span class="adv">' + m + '</span>' : m;
    });
    var title = s.words + ' words';
    return s.level ? '<span class="' + s.level + '" title="' + title + '">' + html + '</span>' : html;
  }

  function render() {
    var raw = $('text').value;
    var limit = Math.max(10, Math.min(60, Number($('limit').value) || 25));
    var a = analyse(raw, limit);
    if (!a.words) {
      $('results').hidden = true;
      $('empty').hidden = false;
      $('badge').textContent = 'No text yet';
      $('badge').className = 'badge';
      return;
    }
    $('results').hidden = false;
    $('empty').hidden = true;
    var b = band(a.ease);
    var score = Math.round(a.ease);
    $('badge').textContent = 'Reading ease ' + score;
    $('badge').className = 'badge badge-' + b[2];
    $('band').textContent = b[0];
    $('bandNote').textContent = b[1];
    $('gaugeText').textContent = score;
    var color = b[2] === 'success' ? 'var(--success)' : (b[2] === 'warning' ? 'var(--warning)' : 'var(--destructive)');
    $('gaugeFill').style.stroke = color;
    $('gaugeFill').style.strokeDasharray = CIRC.toFixed(2);
    $('gaugeFill').style.strokeDashoffset = (CIRC * (1 - score / 100)).toFixed(2);

    var metrics = [
      ['Words', a.words.toLocaleString()],
      ['Sentences', a.sentences.toLocaleString()],
      ['Avg sentence', a.avgSentence.toFixed(1) + ' words'],
      ['Longest', a.longest + ' words'],
      ['Grade level', a.grade.toFixed(1)],
      ['Reading time', a.minutes < 1 ? 'under 1 min' : Math.round(a.minutes) + ' min']
    ];
    $('metrics').innerHTML = metrics.map(function (m) { return '<div class="metric"><small>' + m[0] + '</small><strong>' + m[1] + '</strong></div>'; }).join('');

    var flags = [
      [a.long + a.veryLong, 'Long sentences', 'Over ' + limit + ' words. Break one in two, or make sure it earns its length.', a.veryLong ? 'danger' : 'warning'],
      [a.adverbs, 'Adverbs', 'Words ending in -ly. A stronger verb usually does the job alone.', 'info'],
      [a.passive, 'Maybe passive', 'A form of "to be" before a past participle. Fine when the actor doesn\'t matter.', 'danger'],
      [a.filler, 'Filler words', 'very, really, just, quite, actually. Read the sentence without them.', 'warning']
    ];
    $('flags').innerHTML = flags.map(function (f) {
      return '<div class="list-item"><span><strong>' + f[1] + '</strong><small>' + f[2] + '</small></span>' +
        '<span class="badge' + (f[0] ? ' badge-' + f[3] : ' badge-success') + '">' + (f[0] || 'None') + '</span></div>';
    }).join('');

    $('preview').innerHTML = a.paragraphs.map(function (sents) {
      return '<p>' + sents.map(markSentence).join(' ') + '</p>';
    }).join('');
  }

  var saveTimer = null;
  function schedule() {
    render();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      store.set('draft', $('text').value.slice(0, MAX_DRAFT));
    }, 600);
  }

  $('text').addEventListener('input', schedule);
  $('limit').addEventListener('input', function () { store.set('limit', Number($('limit').value) || 25); render(); });
  $('clear').addEventListener('click', function () { $('text').value = ''; store.set('draft', ''); render(); $('text').focus(); });

  async function start() {
    if (window.hillnote) { try { await hillnote.ready(); } catch (e) { /* render anyway */ } }
    $('limit').value = store.get('limit', 25) || 25;
    $('text').value = store.get('draft', '') || '';
    render();
  }
  start();
})();
</script>
</body>
</html>
