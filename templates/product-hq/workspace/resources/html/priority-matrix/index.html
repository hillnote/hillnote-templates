<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="hillnote-baseline">
/* hillnote-baseline v1 */
:root{
  color-scheme:light dark;
  --background:light-dark(#f7f7f8,#131316);
  --foreground:light-dark(#1c1c1f,#ededf0);
  --card:light-dark(#ffffff,#1c1c20);
  --card-foreground:light-dark(#1c1c1f,#ededf0);
  --muted:light-dark(#efeff1,#26262b);
  --muted-foreground:light-dark(#6f6f78,#9d9da7);
  --secondary:light-dark(#ececef,#26262b);
  --secondary-foreground:light-dark(#1c1c1f,#ededf0);
  --accent:light-dark(#ececef,#2b2b31);
  --accent-foreground:light-dark(#1c1c1f,#ededf0);
  --primary:#4B0082;
  --primary-foreground:#ffffff;
  --destructive:light-dark(#dc2626,#ef4444);
  --destructive-foreground:#ffffff;
  --success:light-dark(#16a34a,#4ade80);
  --warning:light-dark(#d97706,#fbbf24);
  --info:light-dark(#2563eb,#60a5fa);
  --border:light-dark(#e2e2e6,#2c2c32);
  --input:light-dark(#d9d9de,#34343b);
  --ring:#4B0082;
  --radius:8px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 1px 2px rgb(0 0 0/.05);
  --shadow:0 4px 12px -2px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.05);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--background);color:var(--foreground);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650}
h1{font-size:19px}h2{font-size:16px}h3{font-size:14px}
h4{font-size:12px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 .75em}
a{color:var(--primary)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--muted);padding:2px 5px;border-radius:4px}
img,svg,canvas,video{max-width:100%}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px;font-weight:500;line-height:1.2;cursor:pointer;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,opacity .15s;text-decoration:none;user-select:none}
button:hover,.btn:hover{background:var(--muted)}
button:active,.btn:active{transform:translateY(.5px)}
button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.1)}
.btn-destructive{background:var(--destructive);border-color:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover{background:var(--destructive);filter:brightness(1.1)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--muted)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:6px;width:30px;height:30px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
input[type=range]{padding:0;border:none;box-shadow:none;accent-color:var(--primary)}
input[type=color]{width:36px;height:30px;padding:2px}
:is(button,.btn,input,select,textarea,a,summary):focus-visible{outline:2px solid color-mix(in srgb,var(--ring) 55%,transparent);outline-offset:1px}
label{font-size:12px;font-weight:500;color:var(--muted-foreground)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted-foreground)}
th,td{padding:7px 10px;border-bottom:1px solid var(--border)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--card-foreground);box-shadow:var(--shadow);padding:16px;max-width:min(92vw,420px)}
dialog::backdrop{background:rgb(0 0 0/.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;margin:-14px -14px 12px;padding:10px 14px;background:color-mix(in srgb,var(--background) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:calc(var(--radius) - 2px);border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--muted);color:var(--muted-foreground)}
.badge-success{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.badge-warning{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.badge-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.badge-danger{background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive)}
.muted{color:var(--muted-foreground)}
.empty-state{padding:32px 12px;text-align:center;color:var(--muted-foreground);font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground);border:2px solid transparent;background-clip:padding-box}
</style>
<script id="hillnote-error-bridge">(function(){var seen={};function send(m,s,l){try{m=String(m).slice(0,500);var k=m+'|'+(l||0);if(seen[k])return;seen[k]=1;window.parent.postMessage({type:'hillnote-tool-error',message:m,source:s?String(s).slice(0,200):'',line:l||0},'*')}catch(e){}}
window.addEventListener('error',function(e){send(e.message||'Script error',e.filename,e.lineno)});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;send((r&&r.message)||String(r||'Unhandled promise rejection'),'',0)});
var ce=console.error;console.error=function(){try{send(Array.prototype.map.call(arguments,function(a){return a instanceof Error?(a.message||String(a)):(typeof a==='object'?JSON.stringify(a):String(a))}).join(' '),'',0)}catch(e){}return ce.apply(console,arguments)};})()</script>
<title>Priority matrix</title>
<style>
  [hidden] { display: none !important; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; align-items: start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; display: block; }
  .quad { font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; fill: var(--muted-foreground); }
  .axis { font-size: 11px; fill: var(--muted-foreground); }
  .dot { cursor: pointer; stroke: var(--card); stroke-width: 2; }
  .dot:hover, .dot.selected { stroke: var(--foreground); }
  .dot-label { font-size: 11px; fill: var(--foreground); pointer-events: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted-foreground); margin-top: 8px; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 5px; vertical-align: middle; }
  .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .stat:last-of-type { border-bottom: none; }
  .stat span:first-child { color: var(--muted-foreground); }
  .moves { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; margin-inline-start: auto; color: var(--foreground); }
</style>
</head>
<body>
<div class="toolbar">
  <strong>Priority matrix</strong>
  <span class="muted" id="count"></span>
  <label><input type="checkbox" id="shipped"> Show shipped</label>
</div>
<div id="empty" class="empty-state" hidden></div>
<div class="layout" id="layout" hidden>
  <div class="card">
    <svg id="chart" viewBox="0 0 640 440" role="img" aria-label="Expected impact against effort"></svg>
    <div class="legend" id="legend"></div>
  </div>
  <aside class="card" id="detail"></aside>
</div>
<script>
(function () {
  var STATUS_COLORS = { Now: 'var(--warning)', Next: 'var(--info)', Later: 'var(--muted-foreground)', Shipped: 'var(--success)' };
  var MOVES = ['Now', 'Next', 'Later'];
  var W = 640, H = 440, PAD = { l: 52, r: 18, t: 18, b: 44 };
  var $ = function (id) { return document.getElementById(id); };
  var num = function (v) { var n = Number(v); return Number.isFinite(n) ? n : null; };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var source = null;
  var rows = [];
  var selectedId = null;

  function showEmpty(message) {
    $('layout').hidden = true;
    $('empty').hidden = false;
    $('empty').textContent = message;
  }

  function rice(r) {
    var given = num(r.rice);
    if (given !== null) return given;
    var e = num(r.effort);
    return e ? Math.round((num(r.reach) || 0) * (num(r.impact) || 0) * (num(r.confidence) || 0) / e) : null;
  }

  function points() {
    return rows
      .filter(function (r) { return $('shipped').checked || r.status !== 'Shipped'; })
      .map(function (r) { return Object.assign({}, r, { x: num(r.effort), y: (num(r.impact) || 0) * (num(r.confidence) || 0) }); })
      .filter(function (p) { return p.x !== null && p.x > 0 && p.y > 0; });
  }

  function render() {
    var pts = points();
    $('count').textContent = pts.length === 1 ? '1 initiative' : pts.length + ' initiatives';
    if (!rows.length) return showEmpty('No initiatives yet. Add rows to the Roadmap and fill in Impact, Confidence and Effort.');
    if (!pts.length) return showEmpty('Fill in Impact, Confidence and Effort on a few initiatives to place them on the matrix.');
    $('empty').hidden = true;
    $('layout').hidden = false;

    var maxX = Math.max.apply(null, pts.map(function (p) { return p.x; })) * 1.15;
    var maxY = Math.max.apply(null, pts.map(function (p) { return p.y; })) * 1.15;
    var maxReach = Math.max.apply(null, pts.map(function (p) { return num(p.reach) || 1; }));
    var sx = function (x) { return PAD.l + (x / maxX) * (W - PAD.l - PAD.r); };
    var sy = function (y) { return H - PAD.b - (y / maxY) * (H - PAD.t - PAD.b); };
    var midX = sx(maxX / 2), midY = sy(maxY / 2);
    var right = W - PAD.r, bottom = H - PAD.b;
    var svg = '';
    svg += '<rect x="' + PAD.l + '" y="' + PAD.t + '" width="' + (midX - PAD.l) + '" height="' + (midY - PAD.t) + '" style="fill: color-mix(in srgb, var(--success) 9%, transparent)"/>';
    svg += '<rect x="' + midX + '" y="' + midY + '" width="' + (right - midX) + '" height="' + (bottom - midY) + '" style="fill: color-mix(in srgb, var(--destructive) 7%, transparent)"/>';
    svg += '<line x1="' + midX + '" y1="' + PAD.t + '" x2="' + midX + '" y2="' + bottom + '" style="stroke: var(--border)"/>';
    svg += '<line x1="' + PAD.l + '" y1="' + midY + '" x2="' + right + '" y2="' + midY + '" style="stroke: var(--border)"/>';
    svg += '<line x1="' + PAD.l + '" y1="' + bottom + '" x2="' + right + '" y2="' + bottom + '" style="stroke: var(--muted-foreground)"/>';
    svg += '<line x1="' + PAD.l + '" y1="' + PAD.t + '" x2="' + PAD.l + '" y2="' + bottom + '" style="stroke: var(--muted-foreground)"/>';
    svg += '<text class="quad" x="' + (PAD.l + 10) + '" y="' + (PAD.t + 18) + '">Quick wins</text>';
    svg += '<text class="quad" x="' + (right - 10) + '" y="' + (PAD.t + 18) + '" text-anchor="end">Big bets</text>';
    svg += '<text class="quad" x="' + (PAD.l + 10) + '" y="' + (bottom - 10) + '">Fill-ins</text>';
    svg += '<text class="quad" x="' + (right - 10) + '" y="' + (bottom - 10) + '" text-anchor="end">Money pits</text>';
    svg += '<text class="axis" x="' + ((PAD.l + right) / 2) + '" y="' + (H - 10) + '" text-anchor="middle">Effort (person-weeks) →</text>';
    svg += '<text class="axis" transform="translate(16 ' + ((PAD.t + bottom) / 2) + ') rotate(-90)" text-anchor="middle">Impact × confidence →</text>';
    // Dots first, nudging any that land on top of another, then labels placed where they don't collide.
    var dots = pts.sort(function (a, b) { return (num(b.reach) || 0) - (num(a.reach) || 0); }).map(function (p) {
      return { p: p, r: 6 + 12 * Math.sqrt((num(p.reach) || 1) / maxReach), cx: sx(p.x), cy: sy(p.y) };
    });
    dots.forEach(function (d, i) {
      var twins = dots.slice(0, i).filter(function (o) { return Math.abs(o.cx - d.cx) < 4 && Math.abs(o.cy - d.cy) < 4; }).length;
      if (twins) { var a = twins * 2.4; d.cx += Math.cos(a) * d.r * 1.3; d.cy += Math.sin(a) * d.r * 1.3; }
    });
    var boxes = dots.map(function (d) { return { x: d.cx - d.r, y: d.cy - d.r, w: d.r * 2, h: d.r * 2 }; });
    var hits = function (b) {
      if (b.x < PAD.l || b.x + b.w > right || b.y < PAD.t || b.y + b.h > bottom) return true;
      return boxes.some(function (o) { return b.x < o.x + o.w && o.x < b.x + b.w && b.y < o.y + o.h && o.y < b.y + b.h; });
    };
    dots.forEach(function (d, i) {
      var p = d.p, cx = d.cx, cy = d.cy, r = d.r;
      var color = STATUS_COLORS[p.status] || 'var(--primary)';
      var label = String(p.title || '').length > 24 ? String(p.title).slice(0, 23) + '…' : String(p.title || '');
      var tw = label.length * 6, th = 13;
      var spots = [
        { x: cx + r + 4, y: cy - th / 2, anchor: 'start' },
        { x: cx - r - 4 - tw, y: cy - th / 2, anchor: 'end' },
        { x: cx - tw / 2, y: cy - r - 3 - th, anchor: 'middle' },
        { x: cx - tw / 2, y: cy + r + 3, anchor: 'middle' }
      ];
      if (cx > W * 0.7) spots.unshift(spots.splice(1, 1)[0]);
      var own = boxes[i];
      boxes[i] = { x: 0, y: 0, w: 0, h: 0 };
      var spot = spots.find(function (s) { return !hits({ x: s.x, y: s.y, w: tw, h: th }); }) || spots[0];
      boxes[i] = own;
      boxes.push({ x: spot.x, y: spot.y, w: tw, h: th });
      var tx = spot.anchor === 'start' ? spot.x : spot.anchor === 'end' ? spot.x + tw : spot.x + tw / 2;
      svg += '<circle class="dot' + (p.id === selectedId ? ' selected' : '') + '" data-id="' + esc(p.id) + '" cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(1) + '" style="fill: ' + color + '; fill-opacity: .85"><title>' + esc(p.title) + '</title></circle>';
      svg += '<text class="dot-label" x="' + tx.toFixed(1) + '" y="' + (spot.y + th - 3).toFixed(1) + '"' + (spot.anchor === 'start' ? '' : ' text-anchor="' + spot.anchor + '"') + '>' + esc(label) + '</text>';
    });
    $('chart').innerHTML = svg;
    $('legend').innerHTML = Object.keys(STATUS_COLORS).map(function (s) {
      return '<span><span class="swatch" style="background:' + STATUS_COLORS[s] + '"></span>' + s + '</span>';
    }).join('') + '<span>Dot size = reach</span>';
    renderDetail();
  }

  function renderDetail() {
    var r = rows.find(function (x) { return x.id === selectedId; });
    if (!r) {
      $('detail').innerHTML = '<h3>Pick an initiative</h3><p class="muted">Click a dot to see its numbers and move it between Now, Next and Later. Top left is where the quick wins are.</p>';
      return;
    }
    var stats = [['RICE', rice(r)], ['Reach', r.reach], ['Impact', r.impact], ['Confidence', r.confidence], ['Effort', r.effort], ['Theme', r.theme]];
    var html = '<h3>' + esc(r.title) + '</h3>';
    html += '<p><span class="badge">' + esc(r.status || 'No status') + '</span></p>';
    html += stats.map(function (s) { return '<div class="stat"><span>' + s[0] + '</span><span>' + esc(s[1] == null || s[1] === '' ? '—' : s[1]) + '</span></div>'; }).join('');
    html += '<div class="moves">' + MOVES.map(function (m) {
      return '<button class="btn-sm' + (m === r.status ? ' btn-primary' : '') + '" data-move="' + m + '"' + (m === r.status ? ' disabled' : '') + '>' + m + '</button>';
    }).join('') + '</div>';
    $('detail').innerHTML = html;
  }

  async function load() {
    try {
      rows = await source.rows({ limit: 500 });
    } catch (err) {
      return showEmpty('Could not read the roadmap: ' + (err && err.message ? err.message : err));
    }
    render();
  }

  $('chart').addEventListener('click', function (e) {
    var id = e.target && e.target.getAttribute ? e.target.getAttribute('data-id') : null;
    if (!id) return;
    selectedId = id;
    render();
  });

  $('detail').addEventListener('click', async function (e) {
    var move = e.target && e.target.getAttribute ? e.target.getAttribute('data-move') : null;
    if (!move || !selectedId) return;
    e.target.disabled = true;
    try {
      await source.update(selectedId, { status: move });
      await load();
    } catch (err) {
      e.target.disabled = false;
      $('detail').insertAdjacentHTML('beforeend', '<p class="muted">Could not update: ' + esc(err && err.message ? err.message : err) + '</p>');
    }
  });

  async function start() {
    if (!window.hillnote) return showEmpty('Open this tool inside Hillnote, as the Matrix view of the Roadmap database.');
    await hillnote.ready();
    try {
      source = await hillnote.data();
    } catch (err) {
      return showEmpty('Use this tool as a view on a roadmap database with Reach, Impact, Confidence and Effort columns.');
    }
    $('shipped').checked = !!hillnote.settings.get('showShipped', false);
    $('shipped').addEventListener('change', function () {
      hillnote.settings.set('showShipped', $('shipped').checked);
      render();
    });
    source.onChange(load);
    load();
  }

  start();
})();
</script>
</body>
</html>
