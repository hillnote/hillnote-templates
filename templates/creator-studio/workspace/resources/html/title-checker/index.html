<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="hillnote-baseline">
/* hillnote-baseline v1 */
:root{
  color-scheme:light dark;
  --background:light-dark(#f7f7f8,#131316);
  --foreground:light-dark(#1c1c1f,#ededf0);
  --card:light-dark(#ffffff,#1c1c20);
  --card-foreground:light-dark(#1c1c1f,#ededf0);
  --muted:light-dark(#efeff1,#26262b);
  --muted-foreground:light-dark(#6f6f78,#9d9da7);
  --secondary:light-dark(#ececef,#26262b);
  --secondary-foreground:light-dark(#1c1c1f,#ededf0);
  --accent:light-dark(#ececef,#2b2b31);
  --accent-foreground:light-dark(#1c1c1f,#ededf0);
  --primary:#DC143C;
  --primary-foreground:#ffffff;
  --destructive:light-dark(#dc2626,#ef4444);
  --destructive-foreground:#ffffff;
  --success:light-dark(#16a34a,#4ade80);
  --warning:light-dark(#d97706,#fbbf24);
  --info:light-dark(#2563eb,#60a5fa);
  --border:light-dark(#e2e2e6,#2c2c32);
  --input:light-dark(#d9d9de,#34343b);
  --ring:#DC143C;
  --radius:8px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 1px 2px rgb(0 0 0/.05);
  --shadow:0 4px 12px -2px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.05);
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--background);color:var(--foreground);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650}
h1{font-size:19px}h2{font-size:16px}h3{font-size:14px}
h4{font-size:12px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em}
p{margin:0 0 .75em}
a{color:var(--primary)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--muted);padding:2px 5px;border-radius:4px}
img,svg,canvas,video{max-width:100%}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px;font-weight:500;line-height:1.2;cursor:pointer;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,opacity .15s;text-decoration:none;user-select:none}
button:hover,.btn:hover{background:var(--muted)}
button:active,.btn:active{transform:translateY(.5px)}
button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:var(--primary);filter:brightness(1.1)}
.btn-destructive{background:var(--destructive);border-color:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover{background:var(--destructive);filter:brightness(1.1)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--muted)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:6px;width:30px;height:30px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--foreground);font:inherit;font-size:13px}
textarea{resize:vertical;min-height:64px}
input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--primary)}
input[type=range]{padding:0;border:none;box-shadow:none;accent-color:var(--primary)}
input[type=color]{width:36px;height:30px;padding:2px}
:is(button,.btn,input,select,textarea,a,summary):focus-visible{outline:2px solid color-mix(in srgb,var(--ring) 55%,transparent);outline-offset:1px}
label{font-size:12px;font-weight:500;color:var(--muted-foreground)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted-foreground)}
th,td{padding:7px 10px;border-bottom:1px solid var(--border)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--card-foreground);box-shadow:var(--shadow);padding:16px;max-width:min(92vw,420px)}
dialog::backdrop{background:rgb(0 0 0/.4)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;margin:-14px -14px 12px;padding:10px 14px;background:color-mix(in srgb,var(--background) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:calc(var(--radius) - 2px);border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--muted);color:var(--muted-foreground)}
.badge-success{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.badge-warning{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.badge-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.badge-danger{background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive)}
.muted{color:var(--muted-foreground)}
.empty-state{padding:32px 12px;text-align:center;color:var(--muted-foreground);font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-foreground);border:2px solid transparent;background-clip:padding-box}
</style>
<script id="hillnote-error-bridge">(function(){var seen={};function send(m,s,l){try{m=String(m).slice(0,500);var k=m+'|'+(l||0);if(seen[k])return;seen[k]=1;window.parent.postMessage({type:'hillnote-tool-error',message:m,source:s?String(s).slice(0,200):'',line:l||0},'*')}catch(e){}}
window.addEventListener('error',function(e){send(e.message||'Script error',e.filename,e.lineno)});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;send((r&&r.message)||String(r||'Unhandled promise rejection'),'',0)});
var ce=console.error;console.error=function(){try{send(Array.prototype.map.call(arguments,function(a){return a instanceof Error?(a.message||String(a)):(typeof a==='object'?JSON.stringify(a):String(a))}).join(' '),'',0)}catch(e){}return ce.apply(console,arguments)};})()</script>
<title>Title check</title>
<style>
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted-foreground); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .row-actions { justify-content: space-between; flex-wrap: wrap; font-size: 12px; }
  .checks .list-item { justify-content: space-between; gap: 10px; }
  .checks .what { min-width: 0; }
  .checks .what small { display: block; font-size: 12px; color: var(--muted-foreground); }
  .checks .count { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .previews { display: grid; gap: 12px; }
  .pv-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-foreground); margin-bottom: 6px; }
  .yt { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: start; }
  @media (max-width: 380px) { .yt { grid-template-columns: 1fr; } }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 8px; text-align: center;
    background: linear-gradient(135deg, color-mix(in srgb, var(--foreground) 88%, transparent), color-mix(in srgb, var(--foreground) 70%, transparent)); }
  .thumb span { color: var(--background); font-weight: 800; font-size: 17px; line-height: 1.05; text-transform: uppercase; word-break: break-word; }
  .thumb span em { font-style: normal; color: var(--destructive); }
  .thumb small { position: absolute; right: 5px; bottom: 4px; font-size: 10px; padding: 1px 4px; border-radius: 3px; background: color-mix(in srgb, var(--foreground) 85%, transparent); color: var(--background); }
  .pv-title { font-size: 14px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .pv-sub { font-size: 12px; color: var(--muted-foreground); margin-top: 3px; }
  .phone { max-width: 300px; border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .mail { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
  .mail .from { font-weight: 600; }
  .cut { color: var(--muted-foreground); }
  .notes { margin: 0; padding-inline-start: 18px; font-size: 13px; }
  .notes li + li { margin-top: 4px; }
  .rows .list-item { cursor: pointer; justify-content: space-between; gap: 10px; }
  .rows .list-item.selected { background: color-mix(in srgb, var(--primary) 10%, transparent); }
  .rows .what { min-width: 0; }
  .rows .what strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  .rows .what small { color: var(--muted-foreground); font-size: 12px; }
  .rows .badges { display: flex; gap: 4px; flex: none; }
  section + section { margin-top: 14px; }
</style>
</head>
<body>
<div class="toolbar">
  <strong>Title check</strong>
  <span class="badge" id="verdict">Type a title</span>
</div>

<section class="card stack">
  <div class="field">
    <label for="title">Title</label>
    <input id="title" maxlength="200" placeholder="Why Your Cookies Spread, and the Fixes That Work">
    <div class="meta"><span id="titleWords"></span><span id="titleCount">0 / 100</span></div>
  </div>
  <div class="field">
    <label for="thumb">Thumbnail text</label>
    <input id="thumb" maxlength="80" placeholder="FLAT AGAIN?">
    <div class="meta"><span id="thumbWords"></span><span id="thumbCount"></span></div>
  </div>
  <div class="row row-actions" id="rowActions" hidden>
    <span class="muted" id="rowName"></span>
    <button class="btn-sm" id="saveThumb">Save thumbnail text to the row</button>
  </div>
  <p class="muted" id="saveNote" role="status" style="margin: 0; font-size: 12px"></p>
</section>

<section class="card checks">
  <h4>Platform limits</h4>
  <div class="list" id="checks"></div>
</section>

<section class="card">
  <h4>Previews</h4>
  <div class="previews">
    <div>
      <div class="pv-label">Search results, desktop</div>
      <div class="yt">
        <div class="thumb"><span id="pvThumb"></span><small>10:24</small></div>
        <div><div class="pv-title" id="pvSearch"></div><div class="pv-sub">Your channel · 2 days ago</div></div>
      </div>
    </div>
    <div>
      <div class="pv-label">Phone feed</div>
      <div class="phone"><div class="pv-title" id="pvPhone"></div><div class="pv-sub">Your channel · 12K views</div></div>
    </div>
    <div>
      <div class="pv-label">Email inbox on a phone</div>
      <div class="mail"><span class="from">You</span><span id="pvMail"></span></div>
    </div>
  </div>
</section>

<section class="card" id="notesCard" hidden>
  <h4>Worth a look</h4>
  <ul class="notes" id="notes"></ul>
</section>

<section class="card rows">
  <div class="row" style="justify-content: space-between"><h4 style="margin: 0">From the content calendar</h4><span class="badge" id="rowCount"></span></div>
  <div class="list" id="rows" style="margin-top: 8px"></div>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var memory = {};
  var store = {
    get: function (k, d) { try { return window.hillnote ? hillnote.settings.get(k, d) : (k in memory ? memory[k] : d); } catch (e) { return d; } },
    set: function (k, v) { try { if (window.hillnote) hillnote.settings.set(k, v); else memory[k] = v; } catch (e) { /* ignore */ } }
  };

  // Approximate visible lengths. Platforms change these; treat them as guides.
  var LIMITS = [
    { id: 'yt', label: 'YouTube title', field: 'title', rules: [[50, 'success', 'Shows in full, even on phones'], [70, 'info', 'Fits in search; phones cut it at about 50'], [100, 'warning', 'Cut off in search after about 70 characters'], [Infinity, 'danger', 'Over the 100-character limit']] },
    { id: 'shorts', label: 'Shorts title', field: 'title', rules: [[40, 'success', 'Fits the Shorts feed'], [100, 'warning', 'The Shorts feed shows about 40 characters'], [Infinity, 'danger', 'Over the 100-character limit']] },
    { id: 'tiktok', label: 'TikTok caption opening', field: 'title', rules: [[80, 'success', 'Visible before "more"'], [Infinity, 'info', 'About 80 characters show before "more"']] },
    { id: 'insta', label: 'Instagram caption opening', field: 'title', rules: [[125, 'success', 'Visible before "more"'], [Infinity, 'warning', 'Cut at about 125 characters']] },
    { id: 'mail', label: 'Newsletter subject line', field: 'title', rules: [[40, 'success', 'Fits on a phone'], [60, 'info', 'Fits on desktop; phones cut at about 40'], [Infinity, 'warning', 'Cut off almost everywhere after about 60']] }
  ];
  var HYPE = ['insane', 'shocking', 'unbelievable', "you won't believe", 'mind-blowing', 'gone wrong', 'destroyed', 'secret trick', 'nobody tells you'];
  var STOP = new Set('a an the and or but of to in on for with your you my is are was it this that why how what when do does i we our at by from be as'.split(' '));

  var source = null;
  var rows = [];
  var cols = { thumb: 'thumbnail_text', format: 'format', date: 'publish_date', status: 'status' };
  var selectedId = null;

  var chars = function (s) { return Array.from(s || '').length; };
  var words = function (s) { return (String(s || '').match(/[\w'’-]+/g) || []).length; };
  function cut(text, n) {
    var arr = Array.from(text || '');
    if (arr.length <= n) return esc(text);
    return esc(arr.slice(0, n - 1).join('').replace(/\s+\S*$/, '')) + '<span class="cut">…</span>';
  }
  function grade(len, rules) { for (var i = 0; i < rules.length; i++) if (len <= rules[i][0]) return rules[i]; return rules[rules.length - 1]; }
  function thumbGrade(t) {
    var w = words(t), c = chars(t);
    if (!w) return ['muted', 'Add the words that go on the image'];
    if (w <= 3 && c <= 20) return ['success', 'Readable at phone size'];
    if (w <= 4 && c <= 24) return ['warning', 'Four words is the most a phone screen reads at a glance'];
    return ['danger', 'Too much text for a thumbnail; move it to the title'];
  }

  function render() {
    var title = $('title').value.trim();
    var thumb = $('thumb').value.trim();
    var tl = chars(title);
    $('titleCount').textContent = tl + ' / 100';
    $('titleWords').textContent = title ? words(title) + ' words' : '';
    $('thumbCount').textContent = chars(thumb) + ' characters';
    $('thumbWords').textContent = thumb ? words(thumb) + (words(thumb) === 1 ? ' word' : ' words') : '';

    var results = LIMITS.map(function (l) { return { l: l, g: grade(tl, l.rules) }; });
    var tg = thumbGrade(thumb);
    var html = results.map(function (r) {
      return '<div class="list-item"><div class="what"><strong>' + r.l.label + '</strong><small>' + (title ? r.g[2] : 'Waiting for a title') + '</small></div>' +
        '<span class="badge' + (title ? ' badge-' + r.g[1] : '') + ' count">' + tl + '</span></div>';
    }).join('');
    html += '<div class="list-item"><div class="what"><strong>Thumbnail text</strong><small>' + tg[1] + '</small></div>' +
      '<span class="badge' + (tg[0] === 'muted' ? '' : ' badge-' + tg[0]) + ' count">' + words(thumb) + (words(thumb) === 1 ? ' word' : ' words') + '</span></div>';
    $('checks').innerHTML = html;

    var worst = !title ? null : results.concat([{ g: [0, tg[0] === 'muted' ? 'success' : tg[0]] }]).reduce(function (w, r) {
      var rank = { success: 0, info: 1, warning: 2, danger: 3 }[r.g[1]] || 0;
      return Math.max(w, rank);
    }, 0);
    var verdicts = ['All clear', 'Fine, with a note', 'Worth trimming', 'Too long'];
    var classes = ['badge-success', 'badge-info', 'badge-warning', 'badge-danger'];
    $('verdict').textContent = worst === null ? 'Type a title' : verdicts[worst];
    $('verdict').className = 'badge' + (worst === null ? '' : ' ' + classes[worst]);

    var shownThumb = esc(thumb || 'Thumbnail text');
    var parts = (thumb || '').split(/\s+/).filter(Boolean);
    if (parts.length > 1) {
      var longest = parts.reduce(function (a, b) { return b.length > a.length ? b : a; });
      shownThumb = parts.map(function (p) { return p === longest ? '<em>' + esc(p) + '</em>' : esc(p); }).join(' ');
    }
    $('pvThumb').innerHTML = shownThumb;
    $('pvSearch').innerHTML = title ? cut(title, 70) : '<span class="cut">Your title appears here</span>';
    $('pvPhone').innerHTML = title ? cut(title, 50) : '<span class="cut">Your title appears here</span>';
    $('pvMail').innerHTML = title ? cut(title, 40) : '<span class="cut">Subject line</span>';

    var notes = [];
    var titleWords = (title.toLowerCase().match(/[a-z0-9']+/g) || []).filter(function (w) { return !STOP.has(w) && w.length > 2; });
    var thumbWords = (thumb.toLowerCase().match(/[a-z0-9']+/g) || []).filter(function (w) { return !STOP.has(w) && w.length > 2; });
    var repeated = thumbWords.filter(function (w) { return titleWords.indexOf(w) >= 0; });
    if (repeated.length) notes.push('The thumbnail repeats “' + esc(repeated.join('”, “')) + '” from the title. Let the thumbnail ask and the title answer.');
    var caps = (title.match(/\b[A-Z]{3,}\b/g) || []).filter(function (w) { return w !== 'MSG' && w !== 'DIY'; });
    if (caps.length > 1) notes.push('More than one word in capitals reads as shouting: ' + esc(caps.join(', ')) + '.');
    var hype = HYPE.filter(function (h) { return title.toLowerCase().indexOf(h) >= 0; });
    if (hype.length) notes.push('Hype words cost trust: ' + esc(hype.join(', ')) + '.');
    if (tl > 50) notes.push('Phones show the first 50 characters: “' + esc(Array.from(title).slice(0, 50).join('')) + '”. Does the curious bit land before the cut?');
    $('notesCard').hidden = !notes.length;
    $('notes').innerHTML = notes.map(function (n) { return '<li>' + n + '</li>'; }).join('');

    store.set('draft', { title: $('title').value, thumb: $('thumb').value });
  }

  // ---------------------------------------------------------------- calendar rows
  function rowBadge(r) {
    var g = grade(chars(r.title || ''), LIMITS[0].rules);
    return '<span class="badge badge-' + g[1] + '">' + chars(r.title || '') + '</span>';
  }
  function renderRows() {
    if (!source) {
      $('rowCount').textContent = '';
      $('rows').innerHTML = '<div class="empty-state">Open this tool as the Title check view of the Content calendar to check every planned title at once. You can still type a title above.</div>';
      return;
    }
    $('rowCount').textContent = rows.length === 1 ? '1 item' : rows.length + ' items';
    if (!rows.length) {
      $('rows').innerHTML = '<div class="empty-state">Nothing in the content calendar yet. Add a video and its title shows up here.</div>';
      return;
    }
    var sorted = rows.slice().sort(function (a, b) { return String(a[cols.date] || '9999').localeCompare(String(b[cols.date] || '9999')); });
    $('rows').innerHTML = sorted.map(function (r) {
      var meta = [r[cols.format], r[cols.date], r[cols.thumb] ? '“' + r[cols.thumb] + '”' : 'no thumbnail text'].filter(Boolean).map(esc).join(' · ');
      return '<div class="list-item' + (r.id === selectedId ? ' selected' : '') + '" data-id="' + esc(r.id) + '" role="button" tabindex="0">' +
        '<div class="what"><strong>' + esc(r.title) + '</strong><small>' + meta + '</small></div>' +
        '<div class="badges">' + rowBadge(r) + '</div></div>';
    }).join('');
  }
  function select(id) {
    var r = rows.find(function (x) { return x.id === id; });
    if (!r) return;
    selectedId = id;
    store.set('selected', id);
    $('title').value = r.title || '';
    $('thumb').value = r[cols.thumb] || '';
    $('rowActions').hidden = false;
    $('rowName').textContent = 'Editing ' + r.title;
    $('saveNote').textContent = '';
    render();
    renderRows();
  }

  async function loadRows() {
    try { rows = await source.rows({ limit: 500 }); }
    catch (err) { rows = []; $('saveNote').textContent = 'Could not read the calendar: ' + (err && err.message ? err.message : err); }
    if (selectedId && !rows.some(function (r) { return r.id === selectedId; })) { selectedId = null; $('rowActions').hidden = true; }
    renderRows();
  }

  async function detectColumns() {
    try {
      var list = await Promise.resolve(typeof source.columns === 'function' ? source.columns() : []);
      if (!Array.isArray(list)) return;
      var thumb = list.find(function (c) { return c && /thumb/i.test(c.name || c.id); });
      var date = list.find(function (c) { return c && (c.type === 'date' || c.type === 'datetime'); });
      var fmt = list.find(function (c) { return c && /format/i.test(c.name || c.id); });
      if (thumb) cols.thumb = thumb.id;
      if (date) cols.date = date.id;
      if (fmt) cols.format = fmt.id;
    } catch (e) { /* keep defaults */ }
  }

  $('title').addEventListener('input', render);
  $('thumb').addEventListener('input', render);
  $('rows').addEventListener('click', function (e) {
    var item = e.target.closest ? e.target.closest('[data-id]') : null;
    if (item) select(item.getAttribute('data-id'));
  });
  $('rows').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var item = e.target.closest ? e.target.closest('[data-id]') : null;
    if (item) select(item.getAttribute('data-id'));
  });
  $('saveThumb').addEventListener('click', async function () {
    if (!source || !selectedId) return;
    var patch = {};
    patch[cols.thumb] = $('thumb').value.trim();
    $('saveThumb').disabled = true;
    try {
      await source.update(selectedId, patch);
      $('saveNote').textContent = 'Saved to the row.';
      await loadRows();
    } catch (err) {
      $('saveNote').textContent = 'Could not save: ' + (err && err.message ? err.message : err);
    }
    $('saveThumb').disabled = false;
  });

  async function start() {
    if (window.hillnote) { try { await hillnote.ready(); } catch (e) { /* render anyway */ } }
    var draft = store.get('draft', null);
    if (draft) { $('title').value = draft.title || ''; $('thumb').value = draft.thumb || ''; }
    if (window.hillnote && typeof hillnote.data === 'function') {
      try { source = await hillnote.data(); } catch (e) { source = null; }
    }
    if (source) {
      await detectColumns();
      if (typeof source.onChange === 'function') source.onChange(loadRows);
      await loadRows();
      var saved = store.get('selected', null);
      if (saved && rows.some(function (r) { return r.id === saved; })) {
        selectedId = saved;
        $('rowActions').hidden = false;
        $('rowName').textContent = 'Editing ' + rows.find(function (r) { return r.id === saved; }).title;
        renderRows();
      }
    } else {
      renderRows();
    }
    render();
  }
  start();
})();
</script>
</body>
</html>
